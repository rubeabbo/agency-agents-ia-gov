name: Validate political intelligence integration

on:
  push:
    branches: [main]
    paths:
      - 'agents/political-intelligence/**'
      - 'examples/third-party/political-intelligence/**'
      - 'scripts/*political_intelligence.py'
      - 'economy-political/**'
      - 'political-news/**'
      - 'geopolitical-trends/**'
      - 'conflict-analysis/**'
      - '.github/workflows/political-intelligence.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'agents/political-intelligence/**'
      - 'examples/third-party/political-intelligence/**'
      - 'scripts/*political_intelligence.py'
      - 'economy-political/**'
      - 'political-news/**'
      - 'geopolitical-trends/**'
      - 'conflict-analysis/**'
      - '.github/workflows/political-intelligence.yml'
      - '.gitattributes'

jobs:
  provenance-and-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/political_intelligence.py verify
      - run: python scripts/test_political_intelligence.py
      - run: bash scripts/check-divisions.sh
      - run: bash scripts/lint-agents.sh economy-political/economy-political-analyst.md political-news/political-news-analyst.md geopolitical-trends/geopolitical-trends-analyst.md conflict-analysis/conflict-analysis-analyst.md
